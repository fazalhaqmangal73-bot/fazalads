<!DOCTYPE html>
<html lang="ps">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fazal Ads - راپور</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: white;
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #111;
      text-align: center;
      padding: 20px;
      border-bottom: 2px solid #00bcd4;
    }
    header h1 {
      color: #00bcd4;
      font-size: 2em;
    }
    .report {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: #1c1c1c;
      border-radius: 15px;
      box-shadow: 0 0 15px #00bcd440;
    }
    .report h2 {
      color: #00bcd4;
    }
    .report img, .report video {
      width: 100%;
      border-radius: 10px;
      margin-top: 15px;
    }
    footer {
      text-align: center;
      margin: 30px;
    }
    footer a {
      color: #00bcd4;
      text-decoration: none;
      border: 1px solid #00bcd4;
      padding: 8px 15px;
      border-radius: 6px;
      transition: 0.3s;
    }
    footer a:hover {
      background-color: #00bcd4;
      color: black;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fazal Ads - د اعلانونو او خبرونو راپورونه</h1>
  </header>

  <div class="report">
    <h2>📰 د کابل د بازار اقتصادي راپور</h2>
    <p><b>نېټه:</b> ۲۹ اکتوبر ۲۰۲۵</p>
    <img src="news1.jpg" alt="خبر انځور">
    <p>
      د کابل ښار په نوې سوداګریزې ساحه کې د اعلانونو کاروبار ورځ تر بلې وده کوي...
      د فاضل اعلانونو ټیم د بازار د نرخونو او د نويو اعلاناتي طريقو په اړه راپور چمتو کړی.
    </p>

    <video controls>
      <source src="report-video.mp4" type="video/mp4">
      ستاسو براوزر ویډیو نه‌شي ښودلی.
    </video>
  </div>

  <footer>
    <a href="index.html">🏠 بېرته کور پاڼې ته ستنېدل</a>
  </footer>
</body>
</html>
